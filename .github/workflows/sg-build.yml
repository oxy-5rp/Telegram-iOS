name: Build IPA

on:
  push:
    branches:
      - 'sg-**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which build to produce"
        type: choice
        default: normal
        options:
          - normal
          - test

concurrency:
  group: sg-build-${{ github.ref }}-${{ inputs.flavor || 'normal' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Free up disk space
        run: |
          set -x
          df -h /
          # Keep only the Xcode we are going to use.
          ls /Applications | grep -i xcode || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          df -h /

      - name: Resolve build flavor
        run: |
          set -eu
          if [ "${{ inputs.flavor }}" = "test" ]; then
            echo "SG_CONFIGURATION=build-system/sg-ci-test-configuration.json" >> "$GITHUB_ENV"
            echo "SG_FLAVOR_SUFFIX=-test" >> "$GITHUB_ENV"
          else
            echo "SG_CONFIGURATION=build-system/sg-ci-configuration.json" >> "$GITHUB_ENV"
            echo "SG_FLAVOR_SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode
        run: |
          set -eux
          WANTED=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$WANTED.app" ]; then
            SELECTED="/Applications/Xcode_$WANTED.app"
          else
            # Fall back to the newest Xcode present on the runner image.
            SELECTED=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          fi
          echo "Wanted Xcode $WANTED, using $SELECTED"
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -eux
          # Source paths end up in the binary, so keep them stable across builds.
          sudo mkdir -p /Users/Shared
          sudo chown -R "$(whoami)" /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build the app
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -eux

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          # Telegram demands an APNs-push integrity check from official api_ids,
          # and a sideloaded build has no push entitlement to answer it with, so
          # auth.sendCode just times out. Third-party api_ids are not asked.
          # Kept in repository secrets: an api_hash does not belong in git.
          set +x
          if [ -n "${TG_API_ID:-}" ] && [ -n "${TG_API_HASH:-}" ]; then
            python3 -c "import json,os;p=os.environ['SG_CONFIGURATION'];c=json.load(open(p));c['api_id']=os.environ['TG_API_ID'];c['api_hash']=os.environ['TG_API_HASH'];json.dump(c,open(p,'w'),indent=1)"
            echo "Building with the repository's own api credentials"
          else
            echo "TG_API_ID/TG_API_HASH are not set; building with the configuration defaults"
          fi
          set -x

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --continueOnError \
            --configurationPath="$SG_CONFIGURATION" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect artifacts
        if: success()
        run: |
          set -eu
          cd /Users/Shared/telegram-ios
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          # bazel-bin is a symlink into the bazel output base and the ipa is
          # named after the app (Swiftgram.ipa here), so match on the extension
          # rather than a fixed path or filename.
          IPA="$(find -L bazel-bin/Telegram -maxdepth 1 -name '*.ipa' -type f 2>/dev/null | head -n 1)"
          if [ -z "$IPA" ]; then
            IPA="$(find -L bazel-out -maxdepth 6 -name '*.ipa' -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$IPA" ]; then
            echo "no ipa produced"
            exit 1
          fi
          echo "collected $IPA"
          cp -L "$IPA" "$OUTPUT_PATH/"
          ls -la "$OUTPUT_PATH"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-ipa-${{ env.BUILD_NUMBER }}${{ env.SG_FLAVOR_SUFFIX }}
          path: /Users/Shared/telegram-ios/build/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd /Users/Shared/telegram-ios
          NOTES=$(mktemp)
          {
            echo "Unsigned build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}."
            echo
            echo "Mod features, all off by default, in Swiftgram Settings: Keep Deleted Messages, Ghost Mode (read receipts / online / typing / story views), Don't Notify About Screenshots, Save Message History, Hide Sponsored Messages, Ignore Copy Protection. See MOD.md on the branch."
            echo
            echo "This IPA is signed with the repository's fake codesigning material and must be re-signed (AltServer / Sideloadly / your own certificate) before it will install."
            if [ -n "${SG_FLAVOR_SUFFIX:-}" ]; then
              echo
              echo "**Test build.** New logins go to Telegram's test datacenters, not the real ones. Real accounts cannot be added while running this build."
            fi
          } > "$NOTES"
          gh release create "mod-build-${BUILD_NUMBER}${SG_FLAVOR_SUFFIX:-}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Swiftgram mod ${APP_VERSION} (${BUILD_NUMBER})${SG_FLAVOR_SUFFIX:-}" --notes-file "$NOTES" build/artifacts/*.ipa

      - name: Tail build log on failure
        if: failure()
        run: |
          df -h / || true
          ls -la /Users/Shared/telegram-ios || true
